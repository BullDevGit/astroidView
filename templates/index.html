<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroidView - Visualisation des Workflows Luigi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        .drop-zone:hover {
            border-color: #0d6efd;
        }
        #graph-container {
            height: 600px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">AstroidView - Visualisation des Workflows Luigi</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Charger un projet Luigi</h5>
                        <div class="mb-3">
                            <label for="projectPath" class="form-label">Chemin du projet</label>
                            <input type="text" class="form-control" id="projectPath" placeholder="ex: /chemin/vers/projet">
                        </div>
                        <div class="mb-3">
                            <label for="mainTask" class="form-label">Tâche principale</label>
                            <input type="text" class="form-control" id="mainTask" placeholder="ex: module.tasks.MainTask">
                        </div>
                        <button class="btn btn-primary" onclick="analyzeProject()">Analyser le projet</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Ou charger un fichier unique</h5>
                        <div class="drop-zone" id="dropZone">
                            <p class="mb-0">Déposez votre fichier de workflow Luigi ici<br>ou cliquez pour sélectionner</p>
                            <input type="file" id="fileInput" accept=".py" style="display: none;">
                        </div>
                    </div>
                </div>
                
                <div id="status" class="mt-3"></div>
            </div>
        </div>

        <div id="graph-container">
            <iframe id="graphFrame" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const graphFrame = document.getElementById('graphFrame');

        // Gestion du drag & drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#0d6efd';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#ccc';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
            const file = e.dataTransfer.files[0];
            handleFile(file);
        });

        // Gestion du clic
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleFile(file);
        });

        function handleFile(file) {
            if (!file.name.endsWith('.py')) {
                status.innerHTML = '<div class="alert alert-danger">Veuillez sélectionner un fichier Python</div>';
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            analyzeWorkflow(formData);
        }

        function analyzeProject() {
            const projectPath = document.getElementById('projectPath').value;
            const mainTask = document.getElementById('mainTask').value;

            if (!projectPath || !mainTask) {
                status.innerHTML = '<div class="alert alert-danger">Veuillez remplir tous les champs</div>';
                return;
            }

            const formData = new FormData();
            formData.append('project_path', projectPath);
            formData.append('main_task', mainTask);

            analyzeWorkflow(formData);
        }

        function analyzeWorkflow(formData) {
            status.innerHTML = '<div class="alert alert-info">Analyse en cours...</div>';

            fetch('/analyze', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    status.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                } else {
                    status.innerHTML = '<div class="alert alert-success">Analyse terminée avec succès</div>';
                    // Recharger le graphe
                    graphFrame.src = '/templates/graph.html?' + new Date().getTime();
                }
            })
            .catch(error => {
                status.innerHTML = `<div class="alert alert-danger">Erreur: ${error.message}</div>`;
            });
        }
    </script>
</body>
</html>
